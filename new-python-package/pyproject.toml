[build-system]
# Hatchling builds the wheel and source archive used for distribution.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Name on PyPI must be available.
# python -m pip install package_name
name = "package_name"
version = "0.1.0"
description = "Development configuration utilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Anna Burova", email = "burova.anna+git@gmail.com" },
]

# Add runtime dependencies here.
# Keep this list empty if the package only uses the Python standard library.
dependencies = [
]

keywords = [
    "keyword1",
    "keyword2",
    "keyword3",
]

# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    # "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# python -m pip install -e ".[test]"
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
# python -m pip install -e ".[dev]"
dev = [
    "package_name[test]",
    "build>=1.6.1",
    "twine>=7.0.0",
]

# Uncomment if the package provides a CLI entry point (__main__.py).
# [project.scripts]
# package_name = "package_name.__main__:main"

[project.urls]
# Optional project links can be added here after a repository is created.
homepage = "https://github.com/AnnaBurova/dev-configs/tree/main/new-python-package"
repository = "https://github.com/AnnaBurova/dev-configs"
issues = "https://github.com/AnnaBurova/dev-configs/issues"
changelog = "https://github.com/AnnaBurova/dev-configs/blob/main/new-python-package/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# This path must match the importable package directory under src/.
packages = ["src/package_name"]
only-packages = true

[tool.hatch.build.targets.sdist]
# Keep the source archive focused on files needed to build and use the package.
only-include = [
    "src/package_name",
    "tests",
    "pyproject.toml",
    "LICENSE",
    "README.md",
]
exclude = [
    "__pycache__",
    ".env",
    ".git",
    ".github",
    "*.log",
    "*.pyc",
    "tests/output",
]
